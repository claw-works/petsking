<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>宠物列表 · Pet's King</title>
<style>
  :root {
    --bg:#12141f; --card:#1c1f2e; --card-hover:#232739; --line:rgba(255,255,255,0.08);
    --fg:#e8eaf2; --muted:#8a90ad; --accent:#5b7cfa; --accent-soft:rgba(91,124,250,0.16);
  }
  * { box-sizing: border-box; }
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang SC",sans-serif;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:1160px;margin:0 auto;padding:0 24px;}
  /* top nav */
  .nav{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    background:rgba(18,20,31,0.72);border-bottom:1px solid var(--line);}
  .nav .wrap{display:flex;align-items:center;justify-content:space-between;height:56px;}
  .nav .brand{display:flex;align-items:center;gap:10px;font-weight:700;}
  .nav .brand .dot{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:14px;background:var(--accent);}
  .nav .links{display:flex;gap:6px;align-items:center;}
  .nav .links a{padding:7px 13px;border-radius:9px;font-size:13.5px;color:var(--muted);transition:.15s;}
  .nav .links a:hover{color:var(--fg);background:rgba(255,255,255,0.06);}
  .nav .links a.cur{color:var(--fg);}
  .nav .links a.ghost{border:1px solid var(--line);}

  header{padding:36px 0 6px;}
  header h1{font-size:26px;margin:0;letter-spacing:.2px;}
  .sub{color:var(--muted);font-size:14px;margin:6px 0 28px;}

  .group{margin-bottom:36px;}
  .group h2{font-size:14px;margin:0 0 14px;display:flex;align-items:center;gap:8px;color:var(--muted);
    text-transform:uppercase;letter-spacing:.06em;font-weight:600;}
  .group h2 .icon{font-size:15px;}
  .group h2 .count{font-size:11px;color:var(--muted);background:rgba(255,255,255,0.06);padding:1px 8px;border-radius:8px;}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  @media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr);}}
  @media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:480px){.grid{grid-template-columns:1fr;}}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;
    display:flex;flex-direction:column;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
  }
  .card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 12px 28px -8px rgba(91,124,250,0.35);}

  .card .avatar-wrap{
    position:relative;width:100%;aspect-ratio:1/1;background:linear-gradient(160deg,#232739,#181a26);
    overflow:hidden;
  }
  .card .avatar-wrap img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s ease;}
  .card:hover .avatar-wrap img{transform:scale(1.05);}
  .card .avatar-wrap .fallback-ico{
    position:absolute;inset:0;display:grid;place-items:center;font-size:40px;opacity:.5;
  }
  .card .avatar-wrap .rcorner{
    position:absolute;top:8px;right:8px;font-size:10px;padding:3px 8px;border-radius:7px;
    background:rgba(12,14,23,0.65);backdrop-filter:blur(4px);color:#cfd6ff;border:1px solid rgba(255,255,255,0.1);
  }

  .card .body{padding:13px 15px 15px;display:flex;flex-direction:column;flex:1;}
  .card h3{font-size:14.5px;margin:0 0 4px;font-weight:600;}
  .card p{font-size:12px;color:var(--muted);line-height:1.55;margin:0 0 10px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em;}
  .card .rtags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;}
  .rtag{font-size:10px;padding:2px 8px;border-radius:7px;background:var(--accent-soft);color:#a9bcff;}
  .rtag.muted{background:rgba(255,255,255,0.06);color:var(--muted);}

  .card-actions{display:flex;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
  .card-actions a{
    flex:1;text-align:center;font-size:12px;padding:7px 0;border-radius:8px;color:var(--fg);
    background:rgba(255,255,255,0.05);transition:.15s;
  }
  .card-actions a:hover{background:var(--accent);color:#fff;}
  .card-actions a.primary{background:var(--accent-soft);color:#a9bcff;}
  .card-actions a.primary:hover{background:var(--accent);color:#fff;}
</style>
</head>
<body>
<nav class="nav">
  <div class="wrap">
    <div class="brand"><span class="dot">🐾</span> Pet's King</div>
    <div class="links">
      <a href="../index.html">首页</a>
      <a class="cur" href="./">宠物库</a>
      <a class="ghost" href="https://github.com/claw-works/petsking" target="_blank" rel="noopener">GitHub ↗</a>
    </div>
  </div>
</nav>
<div class="wrap">
  <header>
    <h1>🐾 宠物列表</h1>
  </header>
  <p class="sub">按渲染方案分组，浏览所有可用的桌面宠物。点卡片进 Playground 或直接开始互动。</p>
  <div id="groups"></div>
</div>
<script type="module" src="dashboard.js"></script>
</body>
</html>
