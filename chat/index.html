<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title id="page-title">陪伴聊天 · Pet's King</title>
<link rel="stylesheet" href="chat.css" />
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
  <nav class="nav">
    <div class="wrap">
      <a class="brand" href="../index.html"><span class="dot">🐾</span> Pet's King</a>
      <div class="links">
        <a href="../index.html">首页</a>
        <a href="../dashboard/">宠物库</a>
      </div>
    </div>
  </nav>

  <main class="chat-layout">
    <section class="chat-col">
      <div id="chat-log"></div>
      <form id="chat-form">
        <input id="chat-input" type="text" placeholder="跟她说点什么…" autocomplete="off" />
        <button type="submit">发送</button>
      </form>
    </section>
    <section class="pet-col">
      <h1 id="pet-title"></h1>
      <div id="pet-mount"></div>
      <button id="mute-btn" type="button" class="mute-btn"></button>
    </section>
  </main>

  <script type="module" src="chat.js"></script>
</body>
</html>
